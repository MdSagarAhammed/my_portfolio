<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="DevBoard dashboard preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a1a"/>
      <stop offset="1" stop-color="#08070e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1530"/>
      <stop offset="1" stop-color="#120f1f"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#dots)"/>
  <circle cx="1010" cy="90" r="330" fill="url(#glow)"/>

  <g>
    <rect x="64" y="56" width="1072" height="638" rx="20" fill="#0f0c1b" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="64" y="56" width="1072" height="48" rx="20" fill="#151024"/>
    <rect x="64" y="86" width="1072" height="18" fill="#151024"/>
    <circle cx="94" cy="80" r="5" fill="#ff5f57"/>
    <circle cx="114" cy="80" r="5" fill="#febc2e"/>
    <circle cx="134" cy="80" r="5" fill="#28c840"/>
    <rect x="430" y="68" width="340" height="24" rx="12" fill="#0a0812" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="600" y="84" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="11" fill="#a49bbd" letter-spacing="0.5">devboard.app/dashboard</text>

    <rect x="64" y="104" width="196" height="590" fill="#0c0a16"/>
    <rect x="260" y="104" width="1" height="590" fill="#ffffff" fill-opacity="0.06"/>

    <rect x="88" y="132" width="26" height="26" rx="7" fill="url(#accent)"/>
    <text x="124" y="151" font-family="Inter, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f5f2ff">DevBoard</text>

    <rect x="84" y="190" width="156" height="34" rx="9" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <rect x="96" y="201" width="12" height="12" rx="3" fill="#c4b5fd"/>
    <text x="118" y="211" font-family="Inter, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#e9d5ff">Overview</text>

