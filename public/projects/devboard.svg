      <text x="574" y="256" font-family="Inter, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#f5f2ff">32h</text>
      <rect x="574" y="266" width="80" height="6" rx="3" fill="#8b5cf6" fill-opacity="0.25"/>
      <rect x="574" y="266" width="64" height="6" rx="3" fill="#a78bfa"/>
      <text x="768" y="256" font-family="Inter, Helvetica, sans-serif" font-size="10" fill="#34d399">+8%</text>
    </g>
