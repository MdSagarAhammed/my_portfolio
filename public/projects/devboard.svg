    <text x="128" y="646" font-family="Inter, Helvetica, sans-serif" font-size="9" fill="#a49bbd">Pro workspace</text>

    <text x="288" y="146" font-family="Inter, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#f5f2ff">Good morning, Alex</text>
    <text x="288" y="168" font-family="Inter, Helvetica, sans-serif" font-size="11" fill="#a49bbd">Here is what needs your attention today.</text>
