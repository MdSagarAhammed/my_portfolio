      <line x1="308" y1="420" x2="788" y2="420"/>
      <line x1="308" y1="460" x2="788" y2="460"/>
      <line x1="308" y1="500" x2="788" y2="500"/>
      <line x1="308" y1="540" x2="788" y2="540"/>
    </g>
    <path d="M308 520 C340 500 356 470 384 480 C412 490 424 442 456 436 C488 430 498 466 528 452 C558 438 574 398 606 404 C638 410 646 366 678 358 C710 350 726 392 756 378 C774 370 782 362 788 356 L788 560 L308 560 Z" fill="url(#area)"/>
    <path d="M308 520 C340 500 356 470 384 480 C412 490 424 442 456 436 C488 430 498 466 528 452 C558 438 574 398 606 404 C638 410 646 366 678 358 C710 350 726 392 756 378 C774 370 782 362 788 356" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="678" cy="358" r="4" fill="#e9d5ff"/>
    <circle cx="678" cy="358" r="9" fill="#8b5cf6" fill-opacity="0.25"/>

    <rect x="824" y="312" width="290" height="278" rx="12" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="844" y="340" font-family="Inter, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#f5f2ff">Today&apos;s tasks</text>
    <g>
      <rect x="844" y="362" width="250" height="48" rx="9" fill="#0f0c1b" stroke="#ffffff" stroke-opacity="0.05"/>
      <rect x="858" y="378" width="14" height="14" rx="4" fill="#8b5cf6"/>
      <path d="M861 385l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="884" y="389" font-family="Inter, Helvetica, sans-serif" font-size="10" fill="#f5f2ff">Ship onboarding flow</text>
    </g>
    <g>
      <rect x="844" y="418" width="250" height="48" rx="9" fill="#0f0c1b" stroke="#ffffff" stroke-opacity="0.05"/>
      <rect x="858" y="434" width="14" height="14" rx="4" fill="none" stroke="#a49bbd" stroke-opacity="0.5"/>
      <text x="884" y="445" font-family="Inter, Helvetica, sans-serif" font-size="10" fill="#f5f2ff">Review PR #248</text>
    </g>
    <g>
      <rect x="844" y="474" width="250" height="48" rx="9" fill="#0f0c1b" stroke="#ffffff" stroke-opacity="0.05"/>
      <rect x="858" y="490" width="14" height="14" rx="4" fill="none" stroke="#a49bbd" stroke-opacity="0.5"/>
      <text x="884" y="501" font-family="Inter, Helvetica, sans-serif" font-size="10" fill="#f5f2ff">Write release notes</text>
